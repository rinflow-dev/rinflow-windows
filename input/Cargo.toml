[package]
name = "linkcursor-input"
version = "0.1.0"
edition = "2024"
description = "Input for LinkCursor on Windows beyond a normal process: elevated windows, UAC prompts and the lock screen (an input helper and the service that starts it)"
license = "MPL-2.0"
repository = "https://github.com/rinflow-dev/rinflow-windows"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "linkcursor-input"
path = "src/bin/input.rs"

[[bin]]
name = "linkcursor-service"
path = "src/bin/service.rs"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

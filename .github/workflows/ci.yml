name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [agent, input]
    defaults:
      run:
        working-directory: linkcursor-windows/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: linkcursor-windows
      # The agent builds the core from source, from a sibling folder.
      - uses: actions/checkout@v4
        with:
          repository: rinflow-dev/rinflow-core
          path: linkcursor-core
      - run: rustup update stable; rustup default stable; rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
